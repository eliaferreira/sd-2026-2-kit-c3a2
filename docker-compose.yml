
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  inferencia:
    build: ./inferencia
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLECAO: ${QDRANT_COLECAO:-documentos}
      TIMEOUT_VETORIAL: ${TIMEOUT_VETORIAL:-5.0}
      MODEL_PATH: ${MODEL_PATH:-modelo.joblib}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inferencia}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      URL_INFERENCIA: ${URL_INFERENCIA:-http://inferencia:8001}
      WORKER_TIMEOUT_S: ${WORKER_TIMEOUT_S:-3}
      WORKER_MAX_TENTATIVAS: ${WORKER_MAX_TENTATIVAS:-3}
      WORKER_BACKOFF_S: ${WORKER_BACKOFF_S:-0.5}
    depends_on:
      redis:
        condition: service_healthy
      inferencia:
        condition: service_started

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      URL_INFERENCIA: ${URL_INFERENCIA:-http://inferencia:8001}
      JWT_SEGREDO: ${JWT_SEGREDO:?JWT_SEGREDO precisa ser configurado}
      INFERENCIA_TIMEOUT_S: ${INFERENCIA_TIMEOUT_S:-3}
      INFERENCIA_MAX_TENTATIVAS: ${INFERENCIA_MAX_TENTATIVAS:-3}
      INFERENCIA_BACKOFF_S: ${INFERENCIA_BACKOFF_S:-0.2}
      CIRCUITO_INFERENCIA_FALHAS: ${CIRCUITO_INFERENCIA_FALHAS:-3}
      CIRCUITO_INFERENCIA_ESPERA_S: ${CIRCUITO_INFERENCIA_ESPERA_S:-20}
    depends_on:
      inferencia:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - qdrant_dados:/qdrant/storage

volumes:
  redis_data:
  qdrant_dados:
